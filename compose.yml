name: myservices
x-podman:
  in_pod: false
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:version-10.0_p1-r7@sha256:d32caf5bd3bc68bad4a30716638929e345d015cc0cfe6692a3f99015c288e23b
    pull_policy: always
    environment:
      - PUID=${COMPOSE_PUID:-1000}
      - PGID=${COMPOSE_PGID:-1000}
      - TZ=${COMPOSE_TZ:-Etc/UTC}
      - PASSWORD_ACCESS=false
      - SUDO_ACCESS=false
      - USER_NAME=${COMPOSE_SSH_USERNAME:-sshuser}
    ports:
      - 2222:2222
    restart: unless-stopped
  nix:
    image: docker.io/nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
    pull_policy: always
    volumes:
      - ${NIX_CONFIG_PATH:-.}:/config:Z
    user: "${UID:-1000}:${GID:-1000}"
    userns_mode: keep-id
    working_dir: /config
    entrypoint: /bin/sh -c
    command: sh
  renovate:
    image: docker.io/renovate/renovate:43.288.0@sha256:3b72fc4274c56f65f53dcd4dcbed3143289358e0a2d96f7af215e6cf1923e5f6
    pull_policy: always
    environment:
      - RENOVATE_AUTODISCOVER=${RENOVATE_AUTODISCOVER:-false}
    env_file:
      - path: ${COMPOSE_ENV_PATH}
        required: false
    user: "${UID:-1000}:${GID:-1000}"
    userns_mode: keep-id
  searxng:
    image: docker.io/searxng/searxng:2026.1.11-cf74e1d9e@sha256:35e3520e53621e22566330d876d2a36e4a556628b6567bf2706ceb211c6d9c07
    pull_policy: always
    restart: unless-stopped
    ports:
      - 8888:8080
  dev:
    image: quay.io/michaelvaldron/dev:1.0.0@sha256:461a889bc5d212dca59f0c9f65fd1d0509e4a31266a49deef0eea282c8794649
    pull_policy: always
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: host
    volumes:
      - ${PWD}:/project:Z
  node:
    image: docker.io/library/node:current-alpine3.24@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66
    pull_policy: always
    network_mode: host
    working_dir: /project
    volumes:
      - ${PWD}:/project:Z
    environment:
      YARN_VERSION: ${YARN_VERSION}
    entrypoint: sh -c "npm install -g corepack && corepack enable yarn && corepack prepare yarn@${YARN_VERSION:-stable} --activate && exec \"$@\"" --
    command: node
  node-24:
    image: docker.io/library/node:24.22.1-alpine3.24@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    pull_policy: always
    network_mode: host
    working_dir: /project
    volumes:
      - ${PWD}:/project:Z
    environment:
      YARN_VERSION: ${YARN_VERSION}
    entrypoint: sh -c "corepack enable yarn && corepack prepare yarn@${YARN_VERSION:-stable} --activate && exec \"$@\"" --
    command: node
  node-22:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    pull_policy: always
    network_mode: host
    working_dir: /project
    volumes:
      - ${PWD}:/project:Z
    environment:
      YARN_VERSION: ${YARN_VERSION}
    entrypoint: sh -c "corepack enable yarn && corepack prepare yarn@${YARN_VERSION:-stable} --activate && exec \"$@\"" --
    command: node
  ollama:
    image: docker.io/ollama/ollama:0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    pull_policy: always
    restart: unless-stopped
    user: "1000:1000"
    userns_mode: keep-id:uid=1000,gid=1000
    volumes:
      - ${HOME}/.ollama:/home/ubuntu/.ollama:Z
    ports:
      - 11434:11434
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
    pull_policy: always
    restart: unless-stopped
    environment:
      - WEBUI_AUTH=False
    volumes:
      - ${HOME}/.open-webui:/app/backend/data:Z
    ports:
      - 3002:8080
  ovhcloud:
    image: docker.io/ovhcom/ovhcloud-cli:v0.15.0@sha256:84461e646ff9cf00c83d8adb5f2c3d69827ebac4ab3b6e0b374d4701a68f58ce
    pull_policy: always
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: host
    working_dir: /work
    volumes:
      - ${PWD}:/work:Z
      - ${HOME}/.ovhcloud/config:/config:Z
  ansible:
    image: docker.io/alpine/ansible:2.21.0@sha256:4965f84a0bbe5a370066e3ba9e35c4b8e66a119697cc1b7679fdba5be592e756
    pull_policy: always
    network_mode: host
    working_dir: /apps
    volumes:
      - ${PWD}:/apps:Z
      - ${HOME}/.ssh:/root/.ssh:ro
  fj:
    image: codeberg.org/forgejo-contrib/forgejo-cli:0.7.0@sha256:fb3021ff1bb5286808ebf4449118ed24979459000bf2092882cd3ba1b99811e6
    pull_policy: always
    network_mode: host
    working_dir: /work
    volumes:
      - ${PWD}:/work:Z
      - ${HOME}/.config/forgejo-cli:/root/.config/forgejo-cli:Z
    command: fj
  tea:
    image: docker.io/gitea/tea:0.16.0@sha256:af50a2060ce4d8fd76b7ebe75a3d6db4bb0c615c5bc8f2bdfd8ea83207c4752d
    pull_policy: always
    network_mode: host
    working_dir: /work
    volumes:
      - ${PWD}:/work:Z
      - ${HOME}/.config/tea:/root/.config/tea:Z
    command: tea
