name: myservices
x-podman:
  in_pod: false
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:version-10.0_p1-r7@sha256:d32caf5bd3bc68bad4a30716638929e345d015cc0cfe6692a3f99015c288e23b
    pull_policy: always
    environment:
      - PUID=${COMPOSE_PUID:-1000}
      - PGID=${COMPOSE_PGID:-1000}
      - TZ=${COMPOSE_TZ:-Etc/UTC}
      - PASSWORD_ACCESS=false
      - SUDO_ACCESS=false
      - USER_NAME=${COMPOSE_SSH_USERNAME:-sshuser}
    ports:
      - 2222:2222
    restart: unless-stopped
  nix:
    image: docker.io/nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
    pull_policy: always
    volumes:
      - ${NIX_CONFIG_PATH:-.}:/config:Z
    user: "${UID:-1000}:${GID:-1000}"
    userns_mode: keep-id
    working_dir: /config
    entrypoint: /bin/sh -c
    command: sh
  renovate:
    image: docker.io/renovate/renovate:43.288.0@sha256:3b72fc4274c56f65f53dcd4dcbed3143289358e0a2d96f7af215e6cf1923e5f6
    pull_policy: always
    environment:
      - RENOVATE_AUTODISCOVER=${RENOVATE_AUTODISCOVER:-false}
    env_file:
      - path: ${COMPOSE_ENV_PATH}
        required: false
    user: "${UID:-1000}:${GID:-1000}"
    userns_mode: keep-id
  searxng:
    image: docker.io/searxng/searxng:2026.1.11-cf74e1d9e@sha256:35e3520e53621e22566330d876d2a36e4a556628b6567bf2706ceb211c6d9c07
    pull_policy: always
    restart: unless-stopped
    ports:
      - 8888:8080
  dev:
    image: quay.io/michaelvaldron/dev:1.0.0@sha256:461a889bc5d212dca59f0c9f65fd1d0509e4a31266a49deef0eea282c8794649
    pull_policy: always
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: host
    volumes:
      - ${PWD}:/project:Z
  node:
    image: docker.io/library/node:current-alpine3.24@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66
    pull_policy: always
    network_mode: host
    working_dir: /project
    volumes:
      - ${PWD}:/project:Z
    environment:
      YARN_VERSION: ${YARN_VERSION}
    entrypoint: sh -c "npm install -g corepack && corepack enable yarn && corepack prepare yarn@${YARN_VERSION:-stable} --activate && exec \"$@\"" --
    command: node
  node-24:
    image: docker.io/library/node:24.21.0-alpine3.24@sha256:be80f76cf40ec8e42b9bec49f60a55e0660f30af58d3e5a25530785b30ea67e2
    pull_policy: always
    network_mode: host
    working_dir: /project
    volumes:
      - ${PWD}:/project:Z
    environment:
      YARN_VERSION: ${YARN_VERSION}
    entrypoint: sh -c "corepack enable yarn && corepack prepare yarn@${YARN_VERSION:-stable} --activate && exec \"$@\"" --
    command: node
  node-22:
    image: docker.io/library/node:22.23.2-alpine3.24@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    pull_policy: always
    network_mode: host
    working_dir: /project
    volumes:
      - ${PWD}:/project:Z
    environment:
      YARN_VERSION: ${YARN_VERSION}
    entrypoint: sh -c "corepack enable yarn && corepack prepare yarn@${YARN_VERSION:-stable} --activate && exec \"$@\"" --
    command: node
  ollama:
    image: docker.io/ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    pull_policy: always
    restart: unless-stopped
    user: "1000:1000"
    userns_mode: keep-id:uid=1000,gid=1000
    volumes:
      - ${HOME}/.ollama:/home/ubuntu/.ollama:Z
    ports:
      - 11434:11434
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
    pull_policy: always
    restart: unless-stopped
    environment:
      - WEBUI_AUTH=False
    volumes:
      - ${HOME}/.open-webui:/app/backend/data:Z
    ports:
      - 3002:8080
  ovhcloud:
    image: docker.io/ovhcom/ovhcloud-cli:v0.14.0@sha256:b39bdcfad310486e94c45a412074c7c03b691d862a1613856d6b2918a275d24f
    pull_policy: always
    userns_mode: keep-id:uid=1000,gid=1000
    network_mode: host
    working_dir: /work
    volumes:
      - ${PWD}:/work:Z
      - ${HOME}/.ovhcloud/config:/config:Z
  ansible:
    image: docker.io/alpine/ansible:2.21.0@sha256:4965f84a0bbe5a370066e3ba9e35c4b8e66a119697cc1b7679fdba5be592e756
    pull_policy: always
    network_mode: host
    working_dir: /apps
    volumes:
      - ${PWD}:/apps:Z
      - ${HOME}/.ssh:/root/.ssh:ro
